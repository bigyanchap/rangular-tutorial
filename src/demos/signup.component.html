<form (submit)="save()">
  <input label="Full name" placeholder="e.g. Maya Sharma" [(ngModel)]="name" #nameField="ngModel" required minlength="3">
  <p *ngIf="nameField.invalid && nameField.touched">Name is required and needs at least 3 characters.</p>
  <input label="Email" type="email" placeholder="you@example.com" [(ngModel)]="email" #emailField="ngModel" required email>
  <p *ngIf="emailField.invalid && emailField.touched">Enter a valid email address.</p>
  <input label="Password" type="password" placeholder="At least 6 characters" [(ngModel)]="password" #passwordField="ngModel" required minlength="6">
  <p *ngIf="passwordField.invalid && passwordField.touched">Password is required and needs at least 6 characters.</p>
  <checkbox [checked]="terms" (change)="onTerms($event)">I accept the terms</checkbox>
  <button type="submit" [disabled]="nameField.invalid || emailField.invalid || passwordField.invalid || !terms">Create account</button>
</form>
<p *ngIf="submitted">Welcome aboard, {{ name }}. Your account was created.</p>
