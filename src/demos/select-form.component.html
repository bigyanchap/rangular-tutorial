<form (submit)="save()">
  <input label="Your name" [(ngModel)]="name" placeholder="Type your name">
  <select label="City to visit" [value]="city" (change)="onCity($event)" placeholder="Pick a city">
    <option value="Kathmandu">Kathmandu</option>
    <option value="Pokhara">Pokhara</option>
    <option value="Bhaktapur">Bhaktapur</option>
  </select>
  <switch [checked]="guided" (change)="onGuided($event)">Guided tour</switch>
  <button type="submit" [disabled]="!name || !city">Save the visit</button>
</form>
<p *ngIf="savedLine">{{ savedLine }}</p>
<p *ngIf="!savedLine">The button wakes up when the name is typed and a city is picked.</p>
