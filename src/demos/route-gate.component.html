<switch [checked]="signedIn" (change)="onSignedIn($event)">Signed in</switch>
<p>{{ signedIn ? 'You are signed in.' : 'You are signed out.' }}</p>
<button *ngIf="signedIn" (click)="openDiary()">Open my diary</button>
<button *ngIf="!signedIn" (click)="warn()">Open my diary</button>
<p>One button, two handlers, chosen by the check. In this tutorial the About screen plays the diary, so you can watch the navigation happen.</p>
