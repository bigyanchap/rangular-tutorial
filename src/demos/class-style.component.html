<p class="look-calm" *ngIf="look === 'calm'">A calm line, styled by the look-calm class.</p>
<p class="look-alert" *ngIf="look === 'alert'">An alert line, styled by the look-alert class.</p>
<p class="look-big" *ngIf="look === 'big'">A big line, styled by the look-big class.</p>
<button (click)="show('calm')">Calm</button>
<button (click)="show('alert')">Alert</button>
<button (click)="show('big')">Big</button>
<p [class.look-highlight]="highlighted">This line carries a class binding. The highlight class turns on and off with the button below.</p>
<button (click)="toggleHighlight()">Toggle highlight</button>
