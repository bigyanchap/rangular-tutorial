<section>
  <appbar title="Rangular Tutorial" titleAlign="center"></appbar>
  <icon-button name="chevron-left" routerLink="/home"></icon-button>
  <card *ngIf="lesson">
    <label>Lesson {{ lesson.id }}</label>
    <h2>{{ lesson.title }}</h2>
    <p>{{ lesson.intro }}</p>
  </card>
  <p *ngIf="!lesson">This lesson could not be found.</p>
  <section *ngIf="lesson">
    <label>Code</label>
    <code>{{ lesson.code }}</code>
  </section>
  <card *ngIf="lessonId === 2">
    <label>Live demo: your first component</label>
    <app-hello></app-hello>
  </card>
  <card *ngIf="lessonId === 3">
    <label>Live demo: interpolation</label>
    <app-interpolation-demo></app-interpolation-demo>
  </card>
  <card *ngIf="lessonId === 4">
    <label>Live demo: event binding</label>
    <app-events-demo></app-events-demo>
  </card>
  <card *ngIf="lessonId === 5">
    <label>Live demo: property binding and ngIf</label>
    <app-bindings-demo></app-bindings-demo>
  </card>
  <section *ngIf="lesson">
    <label>Best practice</label>
    <p>{{ lesson.tip }}</p>
  </section>
</section>
